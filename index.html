<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Solo Clocktower</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="title-bar">
        <div class="menu">
          <button
            id="size-settings"
            type="button"
            class="info-button"
            title="Menu"
            aria-label="Menu"
            aria-expanded="false"
            aria-controls="size-popup"
          >
            ☰
          </button>
          <div id="size-popup" class="count-popup size-popup" hidden>
            <small>Town square size</small>
            <div class="size-controls">
              <button id="size-down" type="button" aria-label="Smaller">−</button>
              <strong id="size-value"></strong>
              <button id="size-up" type="button" aria-label="Larger">+</button>
            </div>
          </div>
        </div>
        <h1>Solo Clocktower</h1>
      </header>

      <section id="setup">
        <label>Seats <select id="seats"></select></label>
        <label>Script <select id="script"></select></label>
        <label>Seed <input id="seed" value="42" /></label>
        <button id="random-seed" type="button">Random Seed</button>
        <button id="start">Start</button>
        <p id="error"></p>
      </section>

      <section id="game" hidden>
        <h2 id="role"></h2>
        <p id="status"></p>

        <div class="town-square-wrap">
          <div class="town-square-toolbar">
            <button
              id="count-info"
              type="button"
              class="info-button"
              aria-expanded="false"
              aria-controls="count-popup"
            >
              i
            </button>
            <div id="count-popup" class="count-popup" hidden></div>
          </div>
          <div id="circle" class="circle"></div>
        </div>

        <!-- Always available during the day, with or without a selection. -->
        <div id="day-controls" class="day-controls" hidden>
          <p id="block-status"></p>
          <!-- Nominations wait for you: then End day. -->
          <button id="start-nominations" type="button">Start Nominations</button>
          <button id="pass" type="button" hidden>End day</button>
          <!-- Below End day once nominations have started, with or without a
               selection: Nominate and Request nomination wait for a player
               to be selected. -->
          <div id="nomination-controls" class="nomination-controls" hidden>
            <button id="nominate">Nominate</button>
            <button id="request-nomination">Request nomination</button>
            <!-- One NPC nomination per press; the number still wanting to. -->
            <button id="npc-nominations" type="button">NPC nominations 0</button>
          </div>
          <!-- Once per game, with ROUND_ROBIN_ALIVE or fewer alive: every
               player says their character and information in public. -->
          <div id="round-robin-controls" class="nomination-controls" hidden>
            <button id="round-robin" type="button" title="Once per game: from Seat 1, every player says their character and information in public">Round Robin</button>
          </div>
          <button id="savant" type="button" hidden>Visit the Storyteller</button>
          <button id="fisherman" type="button" hidden>Ask the Storyteller for advice</button>
          <span id="amnesiac-controls" hidden>
            <select id="amnesiac-guess" aria-label="Your guess"></select>
            <button id="amnesiac" type="button">Guess my ability</button>
          </span>
          <p id="day-answer"></p>
        </div>

        <!-- The Boomdandy's countdown: select a living player before it runs
             out (BOOM_WAIT_MS); then everyone points. -->
        <section id="boom-choice" class="night-choice" hidden>
          <h3>💥 The Boomdandy's countdown: <span id="boom-left"></span></h3>
          <p id="boom-pick"></p>
          <p id="boom-error"></p>
        </section>

        <!-- Shown when the Storyteller wakes you for a night choice. -->
        <section id="night-choice" class="night-choice" hidden>
          <h3 id="night-prompt"></h3>
          <p id="night-picks"></p>
          <select id="night-character" aria-label="Character" hidden></select>
          <button id="night-select" type="button">Select</button>
          <button id="night-skip" type="button" hidden>Not tonight</button>
          <p id="night-error"></p>
        </section>

        <section id="actions" hidden>
          <h3 id="selected-player"></h3>
          <p id="talk"></p>
          <button id="ask">Ask</button>
          <button id="slay" hidden>Slay</button>
          <button id="puzzle" hidden>Guess they're the puzzle's drunk</button>
          <span id="artist-controls" hidden>
            <select id="artist-question"></select>
            <button id="artist-ask">Ask Storyteller</button>
          </span>
          <span id="gossip-controls" hidden>
            <select id="gossip-question"></select>
            <button id="gossip-say">Say in public</button>
          </span>
          <p id="answer"></p>

          <!-- The end of a conversation: share your character and
               information with them, or leave. -->
          <div id="conversation-controls" class="conversation-controls" hidden>
            <button id="share-info" type="button">Share My Info</button>
            <button id="leave-conversation" type="button">Leave conversation</button>
          </div>

          <!-- Your Good / Evil mark on the selected player. -->
          <div id="mark" class="mark">
            <span class="mark-label">Your mark:</span>
            <span class="mark-guess" role="group" aria-label="Your mark">
              <button type="button" data-guess="good">Good</button>
              <button type="button" data-guess="evil">Evil</button>
              <button type="button" data-guess="">?</button>
            </span>
          </div>
        </section>

        <div class="cols">
          <section>
            <!-- Collapses when the game is over. -->
            <details id="private-panel" class="panel" open>
              <summary><h2>Storyteller</h2></summary>
              <ol id="private"></ol>
            </details>
          </section>
          <section>
            <!-- Collapses when the game is over. -->
            <details id="public-panel" class="panel" open>
              <summary><h2>Public log</h2></summary>
              <ol id="public"></ol>
            </details>
          </section>
        </div>

        <section id="reveal" hidden>
          <!-- Shown collapsed when the game is over; click to open. -->
          <details id="reveal-panel" class="panel">
            <summary><h2>Final reveal</h2></summary>
            <div id="result"></div>
            <div id="roles"></div>
            <div id="lies"></div>
            <div id="audit"></div>
            <!-- At the bottom of the reveal, so it collapses with it. -->
            <div class="reveal-actions">
              <button id="reset" type="button" class="reset-button">Reset</button>
            </div>
          </details>
          <div class="reveal-actions">
            <a id="download-log" class="download-link" download="log.txt">
              Download log.txt
            </a>
          </div>
        </section>
      </section>
    </main>

    <!-- The popups close when pressed. -->
    <dialog id="script-dialog" class="script-dialog">
      <div id="script-sheet"></div>
    </dialog>

    <dialog id="role-dialog" class="script-dialog role-dialog">
      <div id="role-sheet"></div>
    </dialog>

    <!-- Asks before nominations open early (Start, or Keep talking). -->
    <dialog id="confirm-dialog" class="script-dialog confirm-dialog">
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button id="confirm-yes" type="button">Start nominations</button>
        <button id="confirm-no" type="button">Keep talking</button>
      </div>
    </dialog>

    <!-- Dawn and dusk: what just happened (from the Public Log). -->
    <dialog id="phase-dialog" class="script-dialog phase-dialog">
      <div id="phase-sheet"></div>
    </dialog>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
