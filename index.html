<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Solo Clocktower</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>Solo Clocktower</h1><section id="setup"><label>Seats <select id="seats"></select></label><label>Script <select id="script"></select></label><label>Seed <input id="seed" value="42"></label><button id="start">Start</button><p id="error"></p></section><section id="game" hidden><h2 id="role"></h2><p id="status"></p><div class="town-square-wrap"><div id="circle" class="circle"></div></div><section id="actions" hidden><h3 id="selected-player"></h3><p id="talk"></p><button id="ask">Ask</button><button id="nominate">Nominate</button><button id="slay" hidden>Slay</button><button id="pass">End day</button><p id="answer"></p></section><div class="cols"><section><h2>Storyteller</h2><ol id="private"></ol></section><section><h2>Public log</h2><ol id="public"></ol></section></div><section id="reveal" hidden><h2>Final reveal</h2><div id="result"></div><div id="roles"></div><div id="audit"></div><button id="restart" class="restart-button">Start a new game</button></section></section></main><script type="module" src="src/app.js"></script></body></html>
