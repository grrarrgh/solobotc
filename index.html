<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Solo Clocktower</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="title-bar">
        <div class="menu">
          <button
            id="size-settings"
            type="button"
            class="info-button"
            title="Menu"
            aria-label="Menu"
            aria-expanded="false"
            aria-controls="size-popup"
          >
            ☰
          </button>
          <div id="size-popup" class="count-popup size-popup" hidden>
            <small>Town square size</small>
            <div class="size-controls">
              <button id="size-down" type="button" aria-label="Smaller">−</button>
              <strong id="size-value"></strong>
              <button id="size-up" type="button" aria-label="Larger">+</button>
            </div>
          </div>
        </div>
        <h1>Solo Clocktower</h1>
      </header>

      <section id="setup">
        <label>Seats <select id="seats"></select></label>
        <label>Script <select id="script"></select></label>
        <label>Seed <input id="seed" value="42" /></label>
        <button id="random-seed" type="button">Random Seed</button>
        <button id="start">Start</button>
        <p id="error"></p>
      </section>

      <section id="game" hidden>
        <h2 id="role"></h2>
        <p id="status"></p>

        <div class="town-square-wrap">
          <div class="town-square-toolbar">
            <button
              id="count-info"
              type="button"
              class="info-button"
              aria-expanded="false"
              aria-controls="count-popup"
            >
              i
            </button>
            <div id="count-popup" class="count-popup" hidden></div>
          </div>
          <div id="circle" class="circle"></div>
        </div>

        <!-- Always available during the day, with or without a selection. -->
        <div id="day-controls" class="day-controls" hidden>
          <p id="block-status"></p>
          <button id="pass" type="button">End day</button>
          <button id="savant" type="button" hidden>Visit the Storyteller</button>
          <p id="day-answer"></p>
        </div>

        <!-- Shown when the Storyteller wakes you for a night choice. -->
        <section id="night-choice" class="night-choice" hidden>
          <h3 id="night-prompt"></h3>
          <p id="night-picks"></p>
          <button id="night-select" type="button">Select</button>
          <button id="night-skip" type="button" hidden>Not tonight</button>
          <p id="night-error"></p>
        </section>

        <section id="actions" hidden>
          <h3 id="selected-player"></h3>
          <p id="talk"></p>
          <button id="ask">Ask</button>
          <button id="nominate">Nominate</button>
          <button id="request-nomination">Request nomination</button>
          <button id="slay" hidden>Slay</button>
          <span id="artist-controls" hidden>
            <select id="artist-question"></select>
            <button id="artist-ask">Ask Storyteller</button>
          </span>
          <p id="answer"></p>
        </section>

        <div class="cols">
          <section>
            <h2>Storyteller</h2>
            <ol id="private"></ol>
          </section>
          <section>
            <!-- Collapses when the game is over. -->
            <details id="public-panel" class="panel" open>
              <summary><h2>Public log</h2></summary>
              <ol id="public"></ol>
            </details>
          </section>
        </div>

        <section id="reveal" hidden>
          <!-- Shown collapsed when the game is over; click to open. -->
          <details id="reveal-panel" class="panel">
            <summary><h2>Final reveal</h2></summary>
            <div id="result"></div>
            <div id="roles"></div>
            <div id="audit"></div>
          </details>
          <div class="reveal-actions">
            <button id="reset" type="button" class="reset-button">Reset</button>
            <a id="download-log" class="download-link" download="log.txt">
              Download log.txt
            </a>
          </div>
        </section>
      </section>
    </main>

    <!-- Both popups close when pressed. -->
    <dialog id="script-dialog" class="script-dialog">
      <div id="script-sheet"></div>
    </dialog>

    <dialog id="role-dialog" class="script-dialog role-dialog">
      <div id="role-sheet"></div>
    </dialog>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
