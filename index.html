<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solo Clocktower MVP</title><link rel="stylesheet" href="styles.css"></head><body><main>
<h1>Solo Clocktower</h1><section id="setup"><label>Seats <select id="seats"></select></label><label>Script <select id="script"></select></label><label>Seed <input id="seed" type="number" value="42"></label><button id="start">Start</button><p id="error"></p></section>
<section id="game" hidden><div class="card"><h2 id="role"></h2><p id="ability"></p><p id="status"></p></div><div class="grid"><section><h2>Town</h2><div id="town"></div></section><section><h2>Day action</h2><label>NPC <select id="target"></select></label><div class="buttons"><button id="ask">Ask claim</button><button id="nominate">Nominate</button><button id="slay" hidden>Use Slayer</button><button id="pass">End day; no execution</button></div><p id="reply"></p></section></div><div class="grid"><section><h2>Private Storyteller information</h2><ol id="private"></ol></section><section><h2>Public log</h2><ol id="log"></ol></section></div><button id="restart">New game</button></section>
</main><script type="module" src="src/app.js"></script></body></html>
